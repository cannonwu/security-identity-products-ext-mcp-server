[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "oci-sip-mcp"
version = "0.1.0"
description = "MCP server for OCI SIP inventory and policy risk analysis"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "mcp>=1.18.0",
  "oci>=2.168.2",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.4.2",
]

[project.scripts]
oci-sip-mcp = "oci_sip_mcp.server:main"
oci-sip-repl = "oci_sip_mcp.repl:main"
oci-sip-chat = "oci_sip_mcp.chat:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
